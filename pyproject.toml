[project]
name = "rowdyhacks-xii-inside-men"
version = "0.1.0"
readme = "README.md"
# ROS 2 Jazzy's rclpy is built for the system Python 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "depthai>=3.0",
    "pyserial",
    # Match the system numpy that the ROS packages were built against.
    "numpy<2",
]

[tool.uv]
package = false
